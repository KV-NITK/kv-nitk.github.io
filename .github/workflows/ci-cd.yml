name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Verify (Frontend & Backend)
  # ----------------------------------------------------
  test-and-verify:
    name: Test & Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend App
        run: npm run build
        env:
          VITE_API_URL: https://kannadavedike.nitk.ac.in/api

      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Check Backend Syntax
        run: cd server && node --check src/server.js src/app.js

  # ----------------------------------------------------
  # Job 2: Auto-Deploy on NITK Campus Server (10.14.0.80)
  # Runs on self-hosted runner on 10.14.0.80
  # ----------------------------------------------------
  deploy-to-nitk-server:
    name: Auto-Deploy to NITK Campus Server
    needs: test-and-verify
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restart Backend & Deploy Frontend
        run: |
          cd /home/kannadavedike/kv-nitk.github.io
          git pull origin master
          /usr/bin/sudo systemctl restart kv-backend
          npm run build
          /usr/bin/sudo bash -c 'cp -r build/* /var/www/kannadavedike/ && cp -r build/* /var/www/kannadavedike/kv-nitk.github.io/ && chown -R www-data:www-data /var/www/kannadavedike && systemctl reload nginx'


