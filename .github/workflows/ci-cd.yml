name: CI/CD Pipeline

# Every push to master is built and checked, then deployed to the campus
# server by the self-hosted runner there. Pull requests are only checked.
# (Paused on 29 Aug 2026 while the deploy step kept failing; the cause was the
# runner's work folder, which was named "sudo ./svc.sh install" — a path with
# spaces the runner doesn't quote. It is now "_work" in ~/actions-runner/.runner.)
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Verify (Frontend & Backend)
  # ----------------------------------------------------
  test-and-verify:
    name: Test & Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend App
        run: npm run build
        env:
          VITE_API_URL: https://kannadavedike.nitk.ac.in/api

      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Check Backend Syntax
        run: cd server && node --check src/server.js src/app.js

  # ----------------------------------------------------
  # Job 2: Deploy on the NITK campus server (10.14.0.80)
  # Runs on the self-hosted runner there
  # ----------------------------------------------------
  deploy-to-nitk-server:
    name: Deploy to NITK Campus Server
    needs: test-and-verify
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    # One deploy at a time; a push that lands mid-deploy waits its turn.
    concurrency:
      group: deploy-nitk-server
      cancel-in-progress: false
    steps:
      - name: Deploy via deploy.sh
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          cd /home/kannadavedike/kv-nitk.github.io
          bash deploy.sh
