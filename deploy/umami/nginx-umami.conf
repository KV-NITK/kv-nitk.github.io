# Add these two locations inside the existing server { } block for kannadavedike.nitk.ac.in,
# above the SPA `location /` fallback. They expose only the tracker script and the collect
# endpoint, not the Umami dashboard or its API.

location = /u.js {
    proxy_pass http://127.0.0.1:3001/u.js;
    proxy_set_header Host $host;
}

location = /u/send {
    proxy_pass http://127.0.0.1:3001/u/send;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

